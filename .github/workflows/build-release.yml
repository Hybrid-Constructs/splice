name: Splice

on:
  push:
    branches: [ '**' ]

jobs:
  build:
    uses: Hybrid-Constructs/github-actions/.github/workflows/build-standalone-app.yaml@main
    with:
      application-name: Splice
      # Portable app: no DMG, no WiX bundle. The workflow zips the signed
      # .app / .exe directly, so nothing installer-shaped lives in this repo.
      skip-dmg: true
      skip-installer: true
    secrets: inherit
